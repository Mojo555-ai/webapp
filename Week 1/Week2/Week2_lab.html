<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--linking css style page goes in the head-->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div>
        <!--a generic container, no meaning by itself, used for styling and layout-->
    </div>

    <!--symantics tags--> 
    <header>
  
    <!-- top of section page or section, usually with a logo/tit;e/intro-->
    </header>

    <nav>
        <!-- contains navigation links,
         tells the browser/screen readers "this is the site Menu"-->
    </nav>

    <main>
            <!--bread and butter of the website-->
    </main>

    <section>
        <!--section tags will be inside the <main> tag, groups and related content
            think of it like chapter in a book-->
    </section>

    <footer>
        <!--bottom of the page or section, usually with copyright or contact info-->
    </footer>

    <ul>
        <!--unordered list, bullet points-->
    </ul>

    <ol>
        <!--order list number-->
    </ol>

    <li>
        <!--list item, put inside ul-->
    </li>

    <!--example-->

    <ul>
        <li>oranges</li>
        <li>apple</li>
    </ul>

    <ol>
        <li>oranges</li>
        <li>apple</li>
    </ol>

    <table>
        <!--table container-->
    </table>

    <tr>
        <!--table row-->
    </tr>

    <th>
        <!--table header-->
    </th>

    <td>
        <!--table data-->
    </td>

<!--example of a table-->

    <table border="1px">
        <tr>
            <th>Column 1</th>
            <th>Column 2</th>
        </tr>

        <tr>
            <td>Data 1 </td>
            <td>Data 2 </td>
        </tr>

    </table>
</body>
</html>
