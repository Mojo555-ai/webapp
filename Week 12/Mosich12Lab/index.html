<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Week 12 Lab</title> <!-- Fill in: page title -->
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Contact Us</h1> <!-- Fill in: heading text -->

  <form id="userForm"> <!-- Give your form an id -->
    <label for="name">Name:</label> <!-- Label text -->
    <input id="name" type="text" placeholder="Your name" required />

    <label for="email">Email:</label>
    <input id="email" type="email" placeholder="you@example.com" required />

    <label for="message">Message:</label>
    <textarea id="message" rows="4" placeholder="you@mail.com"></textarea>

    <label for="age">Age:</label>
    <input id="age" type="number" min="0" max="100">

    <button type="submit">Submit</button> <!-- Button type and text -->


  </form>

  <section id="result"></section> <!-- Section to display results -->

</body>
</html>
